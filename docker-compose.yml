version: '3.8'

services:
 
  mongodb:
    image: mongo:6.0
    container_name: mern_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mern_network

  
  redis:
    image: redis:7-alpine
    container_name: mern_redis
    ports:
      - "6379:6379"
    networks:
      - mern_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: mern_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - mern_network

  auth-service:
    build: ./auth-service
    container_name: mern_auth_service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/auth?authSource=admin
      - JWT_SECRET=your_jwt_secret_key_here
      - NODE_ENV=development
    depends_on:
      - mongodb
    networks:
      - mern_network

  course-service:
    build: ./course-service
    container_name: mern_course_service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/courses?authSource=admin
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - mongodb
      - redis
      - elasticsearch
    networks:
      - mern_network

  ai-service:
    build: ./ai-service
    container_name: mern_ai_service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - GEMINI_API_KEY=your_gemini_api_key_here
    networks:
      - mern_network

  # Frontend
  # frontend:
  #   build: ./frontend
  #   container_name: mern_frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - REACT_APP_AUTH_SERVICE_URL=http://localhost:3001
  #     - REACT_APP_COURSE_SERVICE_URL=http://localhost:3002
  #     - REACT_APP_AI_SERVICE_URL=http://localhost:3003
  #   depends_on:
  #     - auth-service
  #     - course-service
  #     - ai-service
  #   networks:
  #     - mern_network


  nginx:
    image: nginx:alpine
    container_name: mern_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth-service
      - course-service
      - ai-service
      # - frontend
    networks:
      - mern_network

volumes:
  mongodb_data:

networks:
  mern_network:
    driver: bridge